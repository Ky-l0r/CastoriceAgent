# ============================================================
#  CI —— 每次 push / PR 自动检查
# ============================================================
#  三个独立作业并行：
#    lint    Python 静态检查与格式（快，10 秒级）
#    test    Python 全量测试（慢，2~4 分钟，需装 chromadb）
#    webapp  前端三方类型检查与构建
#  任一项失败即视为不可合并。
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Python 静态检查：不做任何构建，最快给出反馈 ----
  lint:
    name: Lint / Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装 ruff
        run: pip install "ruff==0.17.0"

      - name: ruff check（规则见 pyproject.toml）
        run: ruff check .

      - name: ruff format --check（只检查不改写）
        run: ruff format --check .

  # ---- Python 测试：项目仅支持 Windows，用 Windows runner 贴合真实环境 ----
  test:
    name: Pytest (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt

      # chromadb 的默认 embedding 走本地 ONNX 模型（all-MiniLM-L6-v2），
      # 首次 add/query 时才下载。开发机通常已有 ~/.cache/chroma 缓存，
      # CI 是全新环境，会在测试期间触发下载——而测试夹具默认禁止联网，
      # 于是 4 个记忆用例在 CI 上必然失败、本地全绿。
      # 在 pytest 之外先预热一次，把模型落进缓存目录，测试期间就不再联网。
      - name: 缓存 embedding 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-default-embedding-v1

      - name: 预热 embedding 模型
        shell: bash
        run: |
          python - <<'PY'
          import chromadb

          client = chromadb.EphemeralClient()
          collection = client.get_or_create_collection("warmup")
          collection.add(ids=["1"], documents=["warmup"])
          print("embedding model ready")
          PY

      # 失败时把用例名以 ::error:: 输出成 annotation：
      # GitHub 的 job 日志需要认证才能下载，但 annotation 是公开可读的，
      # 任何人都能在 Actions 页面（或 API）直接看到是哪个用例挂了。
      #
      # 注意 set +e：GitHub Actions 的 bash 默认带 -e，pytest 非零退出
      # 会让脚本立刻终止，后面的诊断块根本执行不到。
      - name: 运行测试
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short -l > pytest.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "^(FAILED|ERROR)" pytest.log | head -10 | while IFS= read -r line; do
              echo "::error title=Pytest failure::$line"
            done
            # 失败详情：-l 会连带打印局部变量，拼成一条多行 annotation，
            # 这样不登录也能看到实际值（例如 events 列表的内容）。
            detail=$(sed -n '/=== FAILURES ===/,/short test summary info/p' pytest.log | head -50)
            if [ -z "$detail" ]; then
              detail=$(tail -30 pytest.log)
            fi
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\r'/''}
            detail=${detail//$'\n'/'%0A'}
            echo "::error title=Pytest detail::$detail"
            echo "===== 输出尾部 60 行 ====="
            tail -60 pytest.log
          fi
          exit $status

  # ---- 前端：三个 tsconfig 分别做类型检查，再验证 vite 构建 ----
  webapp:
    name: Webapp Typecheck / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 必须与开发环境一致：仓库根的 pnpm-workspace.yaml 使用了
          # onlyBuiltDependencies（pnpm 10+ 语法），pnpm 9 会解析失败。
          # 本机实测 12.14.0，lockfile 为 version 9.0（向后兼容）。
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（renderer / main / preload）
        run: |
          pnpm run check:renderer
          pnpm run check:main
          pnpm run check:preload

      - name: 构建界面
        run: pnpm run build:renderer

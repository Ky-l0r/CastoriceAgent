[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
# 不要递归进打包产物、数据库与脚本目录：
# 显式覆盖 pytest 默认值（默认值里的 *.egg .* _darcs build CVS dist
# node_modules venv {arch} 在这里一并保留，避免被覆盖掉）
norecursedirs = .* build dist 发布包 database scripts docs *.egg _darcs CVS node_modules venv {arch}
markers =
    allow_network: 允许该用例建立真实网络连接（默认所有用例禁用联网）

# config.yaml - 支持多种LLM提供商

# 当前激活的提供商
active_provider: "deepseek"  # 可选: openai, deepseek, aliyun, etc.

# 当前会话模式
mode: "chat"                 # 可选: chat | work | code | learn

# 搜索配置（web_search 工具）
search:
  provider: "bing_html"   # bing_html | bing_api | tavily | serper | bocha | ddg_html | auto
  api_key: ""             # 使用 key 型搜索接口时填写（也可用环境变量 SEARCH_API_KEY）
  base_url: ""            # 可选，自定义兼容接口
  max_results: 5          # 默认返回结果条数
  fetch_content: true     # 是否抓取结果网页正文
  fetch_top_n: 2          # 抓取前 N 条正文

# 表情包配置（AI 每条回复固定附带 1 个表情包；图片放在 Image 目录，文件名主干即标签名）
emoji:
  enabled: true            # 是否允许 AI 发表情包
  probability: 0.35         # 附带表情包的概率（1.0 = 每条回复都发一个，0.6 = 六成概率）
  cooldown_turns: 0        # 概率小于 1.0 时，发过一次后隔几轮才再发
  max_per_session: 0       # 每次启动最多发几个，0 表示不限制
  moods: {}                # 标签名 -> 心情描述（留空用内置默认值）
  keywords: {}             # 标签名 -> 心情关键词列表（留空用内置默认值）

# 各模式的工作目录绑定（Code=可信代码目录，Learn=Obsidian Vault）
#
# 留空表示未绑定，界面右侧面板会提示；这里登记的目录同时是「可信根」，
# 界面里只能绑定到可信根之内的目录，越界会被拒绝。
modes:
  work:
    workdir: ""            # 工作模式的目录（可选）
  code:
    workdir: ""            # 编程模式的可信代码目录
    sandbox: "workspace-write"
  learn:
    vault: ""              # 学习模式的 Obsidian Vault 根目录
    sandbox: "workspace-write"

# 权限与审批
permissions:
  sandbox_default: "read-only"   # read-only | workspace-write | danger-full-access
  approval_policy: "ask"         # ask | never
  command_allowlist: []          # 追加到内置只读命令白名单的命令

# 记忆引擎
memory:
  engine: "embedding"            # embedding | wiki | summary
  summary_threshold: 40          # 累积多少条后压缩
  worldbook_enabled: true

# 所有提供商的配置
#
# 关于 vision（图片输入 / 视觉模型）：
#   填 true 表示该模型支持图片输入，输入区会显示「发送图片」按钮；
#   填 false 表示不支持；不填则由程序按模型名自动判断
#   （如 *-vl、gpt-4o、claude-3 等视为视觉模型）。
#   也可以在「设置」窗口里勾选，保存时会写入对应提供商下面。
providers:
  # OpenAI
  openai:
    api_key: "your-openai-api-key"
    base_url: "https://api.openai.com/v1"
    model: "gpt-4"
    temperature: 0.7
  
  # DeepSeek
  deepseek:
    api_key: "your-deepseek-api-key"
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"
    temperature: 0.7
  
  # 阿里云（通义千问）
  aliyun:
    api_key: "your-aliyun-api-key"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-plus"
    temperature: 0.7
  
  # 其他兼容OpenAI API的服务
  # 只需配置 api_key, base_url, model 即可
  custom:
    api_key: "your-api-key"
    base_url: "https://your-api-endpoint.com/v1"
    model: "your-model-name"

# ---- QQ 渠道（NapCat / OneBot 11 反向 WebSocket，第二期）----
# 整节保持注释状态 = 不启用渠道（缺省行为与第一期完全一致）。
# 启用步骤：装好 NapCat 后取消注释并填写 url / access_token，重启程序。
#   url:              NapCat 反向 WS 服务地址（NapCat 作服务端，本程序作为客户端连入）
#   access_token:     NapCat 的 access token（空串 = 不鉴权；建议必填，鉴权走 Bearer 头）
#   allowed_senders:  发送者 QQ 号白名单（空 = 不限制）
#   allowed_groups:   群号白名单（空 = 不限制）
#   default_chat_type: 裸数字 chat_id 的归属（private | group）
#   max_chunk_len:    长文本分段长度（默认 4500，QQ 消息上限内）
#   report_tools:     是否把工具事件折叠成「正在执行 xx…」提示（默认 false）
#   connect_timeout / reconnect_initial / reconnect_max:
#                     首连超时秒数 / 重连退避起始与上限秒数（默认 10 / 1 / 30）
# channels:
#   napcat:
#     url: "ws://127.0.0.1:3001"
#     access_token: "your-napcat-token"
#     allowed_senders: []
#     allowed_groups: []
#     default_chat_type: "private"
#     max_chunk_len: 4500
#     report_tools: false
#
# 说明：
#   · 首次连接会做 fail-fast 校验：连不上或 token 错误直接报错退出，不会「假在线」；
#   · 断线后按 reconnect_initial → reconnect_max 的指数退避自动重连；
#   · 收到的每条消息按 message_id 幂等去重，重复推送不会重复回复。

# ---- 主动聊天（定时任务，第二期）----
# 主动聊天不写在 config.yaml，而是程序目录下的 schedules.json（运行时生成/更新，
# 不随发布包分发）。格式（顶层映射）与一条示例：
# {
#   "version": 1,
#   "schedules": [
#     {
#       "id": "morning-greeting",
#       "title": "早安问候",
#       "triggers": {"daily": "08:30"},
#       "proactive_message": "早上好，跟她打个招呼",
#       "targets": [
#         {"id": "desktop:main"},
#         {"id": "qq:123456789", "fallback": "desktop"}
#       ],
#       "enabled": true,
#       "first_at": "2026-01-01T00:00:00",
#       "last_sent_at": null
#     }
#   ]
# }
# 字段说明：
#   id                  必填，唯一标识
#   title               必填，最长 120 字符
#   triggers            必填，五选一互斥：
#                         after_seconds: 3600（N 秒后一次）
#                         at: "2026-01-01T09:00:00"（一次性定时）
#                         every_seconds: 7200（固定周期）
#                         daily: "08:30"（每天 HH:MM）
#                         weekly: "10:00"（配合 weekday: 0-6，周一=0）
#   proactive_message   必填，触发时交给模型的合成主动话头
#   targets             必填，至少一个；id 形如 "desktop:main" / "qq:123456789"，
#                       fallback = 渠道离线时回退策略：desktop | skip（默认 skip）
#   enabled             true | false，false 的任务不触发
#   first_at            可选，注册基准（every_seconds 的周期起点等），ISO 字面量
#   last_sent_at        程序维护：最近一次已投递时点，请勿手改
# 投递保证：
#   · 只补发最近一次错过的时点（错过 3 个时点也只发 1 条，不会连环轰炸）；
#   · 先落盘对话、投递成功才推进 last_sent_at（崩溃重启不重发）；
#   · 触发精度为分钟级（秒字段被忽略）。